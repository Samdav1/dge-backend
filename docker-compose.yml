version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: dge-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: universal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d universal"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dge-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dge-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_URI=postgresql+asyncpg://admin:password123@db:5432/universal
      - REDIS_URL=redis://redis:6379/0
      - API_KEY=vo59nkWcjkAtpPosuyqkaF3PDO1llaTT0QQA4JH0ECw3gLDDm9/awTin+wyPvgXLR7iLhTRuXvzs0KcuTe12xw==
      - ALGORITHM=RS256
      - ACCESS_TOKEN_EXPIRE_MINUTE=60
      - EMAIL_TOKEN_EXPIRE_MINUTE=10
      - REFRESH_TOKEN_EXPIRE_DAYS=30
      - EMAIL_PROVIDER=cpanel
      - BACKGROUND_TASK_RUNNER=fastapi
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
