

services:
  db:
    image: postgres:15-alpine
    container_name: dge-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: universal
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d universal"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dge-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dge-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override localhost refs from .env to use compose service names
      - DB_URI=postgresql+asyncpg://admin:password123@db:5432/universal
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./jwt_private.pem:/app/jwt_private.pem:ro
      - ./jwt_public.pem:/app/jwt_public.pem:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
