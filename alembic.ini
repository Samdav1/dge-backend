[alembic]
# This is the main Alembic configuration file.
script_location = alembic
sqlalchemy.url = postgresql+psycopg2://admin:Encrypted103@localhost/universal
keys = root,alembic

[loggers]
keys = root,alembic
[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S